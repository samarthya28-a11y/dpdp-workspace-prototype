<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DPDP Workspace Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hind:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky product bar with surface tabs; each surface renders into #view. Brand name is a live setting. */
:root{
  --paper:#F5F7F4; --card:#FFFFFF; --ink:#12302F; --muted:#4D625F; --line:#D5DDD8;
  --river:#1F6F6B; --mist:#DCEBE8; --gold:#E3A02B; --on-gold:#12302F;
  --red:#B3261E; --amber:#8A5A00; --green:#1E6B3A; --warn:#FBEFD9; --red-bg:#FBE4E1; --green-bg:#DDF0E3;
  --ins:#DDF0E3; --del:#FBE4E1;
  --display:"Bricolage Grotesque","Hind",system-ui,sans-serif;
  --body:"Hind","Noto Sans Devanagari",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0D1B1A; --card:#142726; --ink:#E8F0ED; --muted:#A5B8B4; --line:#2A403D;
  --river:#6FC2BB; --mist:#1B3836; --warn:#2E2614; --red:#FF8A80; --amber:#F2C265; --green:#7FD39B;
  --red-bg:#3A1C1A; --green-bg:#17301F; --ins:#17301F; --del:#3A1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0D1B1A; --card:#142726; --ink:#E8F0ED; --muted:#A5B8B4; --line:#2A403D;
  --river:#6FC2BB; --mist:#1B3836; --warn:#2E2614; --red:#FF8A80; --amber:#F2C265; --green:#7FD39B;
  --red-bg:#3A1C1A; --green-bg:#17301F; --ins:#17301F; --del:#3A1C1A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 17px/1.55 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(2rem,6vw,3.2rem);letter-spacing:-.02em;font-weight:700}
h2{font-size:1.5rem;font-weight:700}h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--card)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo svg{width:38px;height:32px;flex:none}
.logo b{font:700 1.35rem var(--display);letter-spacing:-.02em}
.logo small{font:500 .68rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);display:block;margin-top:-2px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 14px;border-radius:4px;cursor:pointer;font-weight:500;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--mist);color:var(--ink);box-shadow:inset 0 -3px 0 var(--river)}
.sp{flex:1}
.ghost{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.proto{font:500 .7rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.brandpanel{border-top:1px solid var(--line);background:var(--mist)}
.brandpanel .wrap{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:end;padding-block:12px}
.brandpanel label{display:flex;flex-direction:column;font:500 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);gap:4px}
input[type=text],select,textarea{border:1px solid var(--line);background:var(--card);border-radius:4px;padding:8px 10px;min-width:0}
textarea{width:100%;resize:vertical}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
main{padding-block:28px 24px}
.btn{border:1.5px solid var(--ink);background:var(--card);border-radius:4px;padding:10px 18px;font-weight:600;cursor:pointer}
.btn.pri{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.btn.sm{padding:5px 11px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px;min-width:0}
.eyebrow{font:500 .72rem var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--river)}
.mut{color:var(--muted)}.sm{font-size:.9rem}
.mono{font-family:var(--mono)}
.disc{border-top:1px solid var(--line);padding-block:18px 40px;font-size:.85rem;color:var(--muted)}
.chip{font:500 .72rem var(--mono);padding:2px 8px;border:1px solid currentColor;border-radius:3px;white-space:nowrap;display:inline-block}
.c-red{color:var(--red)}.c-amber{color:var(--amber)}.c-green{color:var(--green)}.c-mut{color:var(--muted)}.c-river{color:var(--river)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:.93rem}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font:500 .7rem var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);background:var(--paper)}
tbody tr[data-a]{cursor:pointer}tbody tr[data-a]:hover{background:var(--mist)}
tr.on{background:var(--mist)}
.prog{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--river)}
/* Startup */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:32px;align-items:center;padding-block:20px}
.hero .col{gap:20px}
.steps3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
@media(max-width:760px){.hero{grid-template-columns:1fr}}
.stepper{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.stepper span{font:500 .72rem var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.stepper span.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.qwrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.qwrap h2{font-size:clamp(1.5rem,5vw,2rem)}
.opt{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);cursor:pointer;min-height:54px;text-align:left;width:100%}
.opt[aria-pressed="true"]{border-color:var(--river);background:var(--mist);box-shadow:inset 4px 0 0 var(--river)}
.opt .b{width:22px;height:22px;border:2px solid var(--muted);flex:none;border-radius:50%}
.opt.m .b{border-radius:4px}
.opt[aria-pressed="true"] .b{background:var(--river);border-color:var(--river);box-shadow:inset 0 0 0 3px var(--mist)}
.opt.ns{border-style:dashed}
.why{font-size:.9rem;color:var(--muted)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.cols2{grid-template-columns:1fr}}
.flag{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.callout{border:1.5px solid var(--gold);background:var(--warn);border-radius:6px;padding:16px 18px}
.hz{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;cursor:pointer}
.item:hover{border-color:var(--river)}
.item .box{width:24px;height:24px;border:2px solid var(--muted);border-radius:4px;display:grid;place-items:center;font-weight:700;line-height:1}
.item.done .box{background:var(--river);border-color:var(--river);color:var(--card)}
.item.done .tt{text-decoration:line-through;color:var(--muted)}
.item .meta{grid-column:2/4;display:flex;flex-wrap:wrap;gap:6px}
.drawer{position:fixed;inset:0;z-index:40;background:rgba(10,25,24,.5);display:flex;justify-content:flex-end;align-items:stretch}
.drawer .panel{background:var(--card);width:min(520px,100%);padding:22px max(18px,env(safe-area-inset-right,0px)) 28px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:14px;border-left:1px solid var(--line)}
.dl{display:grid;grid-template-columns:110px 1fr;gap:6px 14px;font-size:.95rem}
.dl dt{font:500 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:4px}
.dl dd{margin:0}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,25,24,.55);display:grid;place-items:center;padding:16px}
.modal .box{background:var(--card);border-radius:8px;max-width:640px;width:100%;max-height:90vh;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:4px;z-index:60;max-width:90vw;font-size:.92rem}
/* Incubator */
.strip{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--card)}
.strip div{padding:12px 14px;border-right:1px solid var(--line);min-width:0}
.strip div:last-child{border-right:0}
.strip b{display:block;font:700 1.7rem var(--display)}
.strip span{font-size:.82rem;color:var(--muted)}
@media(max-width:700px){.strip{grid-template-columns:repeat(2,1fr)}.strip div{border-bottom:1px solid var(--line)}}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media(max-width:1000px){.split{grid-template-columns:1fr}}
.dot{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:.88rem}
.dot::before{content:"";width:10px;height:10px;border-radius:50%;background:currentColor}
.dot.sq::before{border-radius:2px}.dot.tri::before{border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%)}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.fbtn{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:5px 14px;cursor:pointer;font-size:.9rem}
.fbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bulk{background:var(--ink);color:var(--paper);border-radius:6px;padding:10px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bulk select{color:var(--ink)}
/* Law */
.wb{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;gap:14px;align-items:start}
@media(max-width:1000px){.wb{grid-template-columns:1fr}}
.olist{display:flex;flex-direction:column;gap:4px}
.oi{display:flex;justify-content:space-between;gap:8px;align-items:center;text-align:left;border:0;background:none;padding:9px 10px;border-radius:4px;cursor:pointer;border-left:3px solid transparent}
.oi[aria-current="true"]{background:var(--mist);border-left-color:var(--river);font-weight:600}
.stage{display:flex;flex-wrap:wrap;gap:6px}
.stage span{font:500 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border:1px solid var(--line);border-radius:3px;color:var(--muted)}
.stage span.on{background:var(--river);border-color:var(--river);color:var(--card)}
.stage span.past{color:var(--ink);border-color:var(--ink)}
.para{display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.para p{max-width:64ch}
ins{background:var(--ins);text-decoration:none;padding:0 2px}del{background:var(--del)}
.cm{border-left:3px solid var(--gold);padding:6px 10px;background:var(--warn);border-radius:0 4px 4px 0;font-size:.9rem}
.locked{border:1.5px solid var(--green);background:var(--green-bg);border-radius:6px;padding:14px 16px}
.note{background:var(--mist);border-radius:6px;padding:10px 12px;font-size:.88rem}
.sep{display:flex;gap:10px;align-items:center}
.docgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:18px;align-items:start}
@media(max-width:900px){.docgrid{grid-template-columns:1fr}}
.paper{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:26px max(20px,3vw);min-width:0}
.paper h2{font-size:1.5rem}.paper h3{font-size:1rem;margin-top:20px}
.paper ul{padding-left:1.2em;margin:6px 0;max-width:68ch}.paper li{margin-top:3px}
.paper p{max-width:68ch;margin-top:6px}
.paper table{min-width:520px}
mark{background:var(--gold);color:var(--on-gold);padding:0 4px;border-radius:2px}
.cbox{border:1.5px solid var(--ink);padding:12px 14px;border-radius:4px}
.ribbon{background:var(--warn);border:1px solid var(--gold);border-radius:4px;padding:8px 12px;font-size:.9rem;margin-bottom:18px}
.fld{display:flex;flex-direction:column;gap:3px;font:500 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld input{font:400 .95rem var(--body);text-transform:none;letter-spacing:0;color:var(--ink);width:100%}
.fld small{font:400 .78rem var(--body);text-transform:none;letter-spacing:0}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
</style>
</head>
<body>

<div class="bar">
  <div class="wrap">
    <div class="logo">
      <svg viewBox="0 0 120 100" aria-hidden="true">
        <path d="M8 96V52a52 52 0 0 1 104 0v44" fill="none" stroke="var(--river)" stroke-width="9"/>
        <path d="M28 96V54a32 32 0 0 1 64 0v42" fill="none" stroke="var(--ink)" stroke-width="9"/>
        <path d="M48 96V56a12 12 0 0 1 24 0v40" fill="var(--gold)"/>
      </svg>
      <div><b id="bName">Setu</b><small id="bBy">by AWI</small></div>
    </div>
    <div class="tabs" role="tablist" aria-label="Choose a workspace">
      <button class="tab" role="tab" id="tab-startup" data-a="tab" data-v="startup">Startup</button>
      <button class="tab" role="tab" id="tab-incubator" data-a="tab" data-v="incubator">Incubator</button>
      <button class="tab" role="tab" id="tab-law" data-a="tab" data-v="law">Law firm</button>
    </div>
    <span class="sp"></span>
    <span class="proto">Prototype · sample data</span>
    <button class="ghost" id="brandBtn" data-a="brandtoggle" aria-expanded="false" aria-controls="brandPanel">Edit name</button>
  </div>
  <div class="brandpanel" id="brandPanel" hidden>
    <div class="wrap">
      <label>Product name<input type="text" id="inName" value="Setu" maxlength="24"></label>
      <label>"by" company<input type="text" id="inBy" value="AWI" maxlength="24"></label>
      <label>Sample incubator<input type="text" id="inPartner" value="Sample Incubation Centre" maxlength="40"></label>
      <span class="sm mut" style="max-width:340px">Changes every screen, email and document in this prototype. Name is under trademark review.</span>
    </div>
  </div>
</div>

<main class="wrap" id="view"></main>

<div class="wrap disc" id="disc"></div>
<div id="layer"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const e=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S={tab:'startup',brand:'Setu',by:'AWI',partner:'Sample Incubation Centre',
 st:{step:'landing',qi:0,ans:{},done:{},open:null,owner:{},doc:{active:'notice',biz:'Kaveri Naturals',email:'privacy@kaveri.example',reply:'15',retOrders:'7 years',retMkt:'12 months',retSupport:'3 years',retStaff:'',vchk:{},rev:{}}},
 inc:{band:'all',sel:[],open:null,notes:{},mentor:{},counsel:{},nudged:{}},
 law:{view:'queue',role:'associate',stage:'review',item:'notice',comments:[],ver:2,matter:0,lock:null,note:''}};
const AS_OF='16 Oct 2026';
function B(){return S.brand.trim()||'Setu'}
function toast(m){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16).padStart(8,'0')+'a91c'}
const DISC=()=>`${e(B())}${S.by.trim()?' by '+e(S.by.trim()):''} gives guidance and tools. It is not legal advice and does not certify compliance. Guidance as of ${AS_OF}. Only a qualified lawyer can approve your documents for your situation.`;

/* ---------- startup engine ---------- */
const QS=[
 {id:'biz',t:'What does your business do?',ex:'Pick the closest one.',type:'one',opts:[['d2c','Sell products online'],['app','Run an app or software product'],['b2b','Services for other businesses'],['edu','Education or learning'],['health','Health or wellness'],['other','Something else']]},
 {id:'collect',t:'Do you collect details about people?',ex:'Customers, users, leads or visitors. For example names, phone numbers, emails or addresses.',why:'If you never collect personal details, most DPDP duties do not apply to you yet.',type:'one',opts:[['yes','Yes'],['no','No, never'],['ns','Not sure']]},
 {id:'role',t:`Whose customers' details do you handle?`,ex:`Pick the closest. "Other businesses' customers" means you run something for a client, such as their app, payroll, marketing or hosting.`,why:'The business that decides why data is collected carries most duties. A business that only handles data for others has different ones.',type:'one',opts:[['own',`Our own customers, users or staff`],['others',`Other businesses' customers, as a service for them`],['both','Both'],['ns','Not sure']]},
 {id:'details',t:'Which details do you collect?',ex:'Tick everything that applies.',why:'Some details, like ID numbers or health information, need more care.',type:'multi',opts:[['contact','Name, phone, email, address'],['pay','Payment details'],['loc','Location'],['id','ID documents (Aadhaar, PAN, passport)'],['health','Health information'],['photo','Photos or voice'],['ns','Not sure']]},
 {id:'volume',t:'About how many people\'s details do you hold?',ex:'A rough guess is fine.',why:'Bigger databases can mean stricter rules.',type:'one',opts:[['small','Under 1,000'],['mid1','1,000 to 50,000'],['mid','50,000 to 10 lakh'],['big','More than 10 lakh'],['ns','Not sure']]},
 {id:'minors',t:'Are any of your users or customers under 18?',ex:'Students, teens, or family accounts where a child can sign up.',why:'Children\'s data needs a parent or guardian\'s consent and no tracking or targeted ads.',type:'one',opts:[['yes','Yes'],['no','No'],['ns','Not sure']]},
 {id:'track',t:'Do you track people or show them ads?',ex:'Meta pixel, retargeting, analytics tools, personalised offers.',type:'one',opts:[['yes','Yes'],['no','No'],['ns','Not sure']]},
 {id:'vendors',t:'Which outside services see this data?',ex:'Tick the ones you use.',why:'You stay responsible for data your vendors handle.',type:'multi',opts:[['pay','Payment gateway'],['crm','CRM or email tool'],['cloud','Cloud hosting'],['courier','Courier or delivery partner'],['wa','WhatsApp or SMS provider'],['analytics','Analytics or ad tools'],['ns','Not sure']]},
 {id:'abroad',t:'Is any of this data stored or processed outside India?',ex:'Overseas cloud regions or foreign vendors. Check your hosting settings if unsure.',type:'one',opts:[['yes','Yes'],['no','No'],['ns','Not sure']]},
 {id:'auto',t:'Do you make decisions about people using software alone?',ex:'For example approving credit, screening job candidates or setting prices per person.',why:'You see this question because of the details you chose earlier.',type:'one',opts:[['yes','Yes'],['no','No'],['ns','Not sure']],
  show:a=>sens(a)||a.volume==='big'},
 {id:'have',t:'What do you already have in place?',ex:'Tick what exists today, even if it is rough.',type:'multi',opts:[['notice','A privacy notice on your site or app'],['delete','A way for people to ask you to delete their data'],['grievance','A named contact for complaints'],['none','None of these yet']]}
];
const sens=a=>(a.details||[]).some(x=>x==='health'||x==='id'||x==='ns')||a.minors==='yes'||a.minors==='ns';
const qList=a=>QS.filter(q=>(q.id==='biz'||q.id==='collect'||a.collect!=='no')&&(!q.show||q.show(a))&&!(a.role==='others'&&['minors','track','auto','have'].includes(q.id)));
const ns=(a,k)=>a[k]==='ns'||(Array.isArray(a[k])&&a[k].includes('ns'));
/* Drop answers for questions that are not currently visible (e.g. after Change answers). */
function pruneAns(a){
  let cur=Object.assign({},a);
  for(let n=0;n<8;n++){
    const ids=new Set(qList(cur).map(q=>q.id));
    const next={};
    for(const k of Object.keys(cur)) if(ids.has(k)) next[k]=cur[k];
    const same=Object.keys(cur).length===Object.keys(next).length&&Object.keys(cur).every(k=>ids.has(k));
    cur=next;
    if(same)break;
  }
  return cur;
}
function derive(raw){
  const a=pruneAns(raw);
  const has=a.have||[], det=a.details||[], ven=(a.vendors||[]).filter(x=>x!=='ns');
  const collect=a.collect!=='no';
  const role=a.role==='others'?'processor':(a.role==='both'||a.role==='ns')?'both':'fiduciary';
  const fid=collect&&role!=='processor',proc=collect&&role!=='fiduciary';
  const vol=a.volume==='ns'?'mid':a.volume;
  const sdf=fid&&(vol==='big'||(vol==='mid'&&sens(a))||a.auto==='yes'||a.auto==='ns');
  const flags=[];
  if(collect&&sens(a))flags.push('You may hold sensitive details (health, ID or children\'s data).');
  if(a.track!=='no'&&fid)flags.push('You track or advertise to people, so you need clear consent.');
  if(a.abroad!=='no'&&collect)flags.push('Data may leave India. Check where your vendors store it.');
  if(fid&&!has.includes('notice'))flags.push('You have no privacy notice yet.');
  if(fid&&!has.includes('grievance'))flags.push('No one is named for complaints yet.');
  const risk=sdf?'Higher':flags.length>=3?'Medium':'Lower';
  const I=[];
  let curScope='';const add=(h,theme,title,why,steps,owner,ev,assumed)=>I.push({id:theme+title,h,theme,title,why,steps,owner,ev,assumed,scope:curScope});
  curScope=role==='both'?'Your customers':'';
  if(fid){
   if(!has.includes('notice'))add('now','Notice','Publish a privacy notice where you collect data','People should know what you collect and why before they share it.',['Use the draft notice in Documents.','Edit it to match what you really do.','Put it on checkout, signup and your app.'],'Founder','Dated screenshot of the live notice; notice version.');
   add('now','Consent','Ask for clear consent, one purpose at a time','Consent must be free, specific and easy to withdraw. No pre-ticked boxes.',['List each reason you use data (orders, marketing, support).','Give marketing its own tick-box.','Record who agreed, when and to which text.'],'Tech lead','Form screenshot; consent log sample.');
   if(!has.includes('grievance'))add('now','Rights and grievance','Name a contact for complaints and requests','People can ask to see, fix or delete their data, and to complain.',['Pick a person and an email address.','Publish both in the notice.','Set a reply time you can keep.'],'Ops lead','Published page; log of test requests.');
   add('now','Breach readiness','Write a one-page breach checklist','If data leaks you must act fast and tell the right people.',['Decide who leads and who calls whom.','List what to check in the first hour.','Save the contact tree where the team can find it.'],'Founder','Signed-off checklist; contact tree.');
   if(a.minors!=='no')add('now','Children\'s data','Get a parent\'s or guardian\'s consent for under-18s','Special rules apply to children. Tracking and targeted ads are not allowed for them.',['Add an age check at signup.','Ask a parent or guardian to consent.','Switch off tracking for child accounts.'],'Tech lead','Age-gate screenshot; parental consent log.',ns(a,'minors'));
   if(sdf)add('now','Counsel review','Talk to a lawyer before you rely on this plan','Your answers look like a bigger-risk profile. This tool can only flag that. A lawyer must decide.',['Request a review from your mentor\'s panel counsel.','Share your plan and notice drafts.'],'Founder','Review request and counsel\'s reply.');
   if(ven.length)add('30','Vendors','List every vendor and check their data terms','You stay responsible for data your vendors handle for you.',['Write down each vendor and what data they get.','Read their data-handling terms.','Ask for a data agreement where it is missing.'],'Ops lead','Vendor register; contract excerpts.');
   add('30','Minimisation','Remove details you do not need','Collect only what you need for the purpose you stated.',['Review every form field.','Delete fields you never use.'],'Tech lead','Before and after form screenshots.');
   add('30','Retention','Set how long you keep each kind of data','Keep data only as long as needed, then delete it.',['Make a table: data type, reason, keep for.','Set a monthly deletion job.'],'Ops lead','Retention table; deletion job log.');
   if(a.track!=='no')add('30','Tracking','Turn on ad and analytics tools only after consent','Tracking tools read personal data.',['Load pixels only after the user agrees.','Test with consent off.'],'Tech lead','Consent-gating test result.',ns(a,'track'));
   if(a.abroad!=='no')add('30','Cross-border','Find out where your data is stored','You need to know which countries handle your data.',['Check hosting regions for each vendor.','Note any country restrictions that apply.'],'Tech lead','Hosting region list.',ns(a,'abroad'));
  }
  if(proc){
   curScope=role==='both'?`Clients' data`:'';
   add('now','Processor contract','Get a written contract with each client',`The business that hires you carries the main duties. The law expects a contract that sets what you may do with its customers' data.`,['List every client whose customers\' data you handle.','Ask for their data-processing agreement, or agree one with a lawyer.','Check it covers purpose, security, breaches, sub-vendors and deletion.'],'Founder','Signed agreements; client list.');
   add('now','Instructions','Use client data only as each contract says',`You may not use a client's data for your own purposes unless the contract allows it.`,['Write down what each client allows.','Block use of client data for your own marketing or product training unless agreed.'],'Founder','Written instructions per client.');
   add('now','Breach readiness','Tell clients fast if their data leaks','Your clients have deadlines of their own to meet. They need to hear from you quickly.',['Agree a notice time in each contract.','Keep a contact list for every client.','Write a one-page checklist for your team.'],'Founder','Checklist; client contact list.');
   if(ven.length)add('30','Sub-vendors','List the vendors that touch client data','Tools you use to serve clients are your sub-vendors. Clients usually want to know about them.',['List each tool and what client data it sees.','Tell clients where the contract requires it.','Use the same data terms with them.'],'Ops lead','Sub-vendor register.');
   add('30','Deletion','Return or delete client data when a contract ends','Do not keep client data longer than the contract allows.',['Write down your end-of-contract steps.','Confirm deletion to the client in writing.'],'Ops lead','Deletion confirmations.');
   if(a.abroad!=='no')add('30','Cross-border','Find out where client data is stored',`Clients may restrict where their customers' data goes.`,['Check hosting regions for each tool.','Compare with each client contract.'],'Tech lead','Hosting region list.',ns(a,'abroad'));
   add('30','Counsel review','Have a lawyer check your client contracts','Your contracts decide what you must do. Only a lawyer can say if they are enough.',[`Share your client contracts with your mentor's panel counsel.`],'Founder','Review request and counsel reply.');
  }
  curScope='';
  add('ongoing','Security','Check who can open your data, every quarter','Reasonable security safeguards are a core duty.',['Turn on two-step login for admin tools.','Remove access for people who left.'],'Tech lead','Quarterly access review log.');
  add('ongoing','Review cadence','Re-read your notice and vendor list every 6 months','Your business changes and so does guidance.',['Put a recurring reminder in the tracker.'],'Founder','Dated review record.');
  if(fid)add('ongoing','Rights','Answer data requests on time','Keep a simple register of every request.',['Log each request.','Reply within the time you promised.'],'Ops lead','Request register.');
  return {sdf,flags,risk,I,collect,role,fid,proc,assumed:Object.keys(a).filter(k=>ns(a,k))};
}

/* ---------- modals / focus ---------- */
let modalFactory=null,focusReturn=null;
function focusables(root){return [...root.querySelectorAll('button:not([disabled]),[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(el=>el.offsetParent!==null||el===document.activeElement)}
function trapFocus(ev){
  if(ev.key!=='Tab')return;
  const root=$('#layer .modal .box')||$('#layer .drawer .panel');if(!root)return;
  const list=focusables(root);if(!list.length)return;
  const first=list[0],last=list[list.length-1];
  if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}
  else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}
}
function rememberFocus(){focusReturn=document.activeElement}
function restoreFocus(){const t=focusReturn;focusReturn=null;if(t&&typeof t.focus==='function')try{t.focus()}catch(_){}}
function modal(htmlOrFn){
  rememberFocus();
  modalFactory=typeof htmlOrFn==='function'?htmlOrFn:null;
  const html=typeof htmlOrFn==='function'?htmlOrFn():htmlOrFn;
  $('#layer').innerHTML=`<div class="modal" data-a="closemodal"><div class="box" role="dialog" aria-modal="true" data-stop>${html}</div></div>`;
  const f=focusables($('#layer .box'))[0];if(f)f.focus();
}
function closeModal(){modalFactory=null;$('#layer').innerHTML='';restoreFocus()}
function refreshModal(){
  if(!modalFactory||!$('#layer .modal'))return;
  const keep=document.activeElement&&document.activeElement.id;
  $('#layer .box').innerHTML=modalFactory();
  if(keep){const el=document.getElementById(keep);if(el)el.focus()}
}

function reportModal(){modal(()=>{const L=S.law,m=MAT[L.matter];return `<span class="eyebrow">Audit report outline</span><h2>${m[1]}: Readiness report</h2>
 <ol class="sm" style="margin:0;padding-left:1.2em;line-height:1.7"><li>Cover (client, matter ${m[0]}, version v${L.ver}, hash ${L.lock?L.lock.hash:''})</li><li>Scope and basis</li><li>Disclaimer and reliance</li><li>Executive summary: top findings</li><li>Role and risk analysis</li><li>Findings by theme (3 findings carried over from review)</li><li>Documents reviewed</li><li>Remediation plan</li><li>Evidence index</li><li>Sign-off block</li></ol>
 <h3>Evidence index</h3><div class="tbl"><table style="min-width:0"><thead><tr><th>Item</th><th>Received</th><th>Linked finding</th></tr></thead><tbody><tr><td>Notice screenshot</td><td>10 Nov</td><td>F1 Notice</td></tr><tr><td>Vendor list</td><td>12 Nov</td><td>F3 Vendors</td></tr><tr><td>Consent log sample</td><td><span class="c-red">Missing</span></td><td>F2 Consent</td></tr></tbody></table></div>
 <p class="sm mut">Not a certification. Guidance as of ${AS_OF}.</p><div class="row"><button class="btn pri" data-a="closemodal">Close</button></div>`})}

/* ---------- render ---------- */
function render(){
  document.querySelectorAll('.tab').forEach(t=>{
    const on=t.dataset.v===S.tab;
    t.setAttribute('aria-selected',on);
    t.tabIndex=on?0:-1;
    t.setAttribute('aria-controls','view');
  });
  $('#bName').textContent=B();$('#bBy').textContent=S.by.trim()?'by '+S.by.trim():'';
  document.title=B()+' Prototype';
  const view=$('#view');
  view.setAttribute('role','tabpanel');
  view.setAttribute('aria-labelledby','tab-'+S.tab);
  view.innerHTML=S.tab==='startup'?vStartup():S.tab==='incubator'?vInc():vLaw();
  $('#disc').innerHTML=DISC();
  const hadDrawer=!!$('#layer .drawer');
  const dr=S.tab==='startup'?drawer():'';
  if(!$('#layer .modal')){
    $('#layer').innerHTML=dr;
    if(dr&&!hadDrawer){
      rememberFocus();
      const f=focusables($('#layer .panel'))[0];if(f)f.focus();
    }
  }
}
function renderKeepModal(){const m=$('#layer .modal');const keep=m?m.outerHTML:null;render();if(keep)$('#layer').innerHTML=keep}

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-a]');if(!el)return;
  if(ev.target.closest('[data-stop]')&&el.hasAttribute('data-stop')===false&&!ev.target.closest('[data-a]:not(.drawer):not(.modal)'))return;
  const a=el.dataset.a,v=el.dataset.v,s=S.st,I=S.inc,L=S.law;
  if((a==='closedrawer'||a==='closemodal')&&el.classList.contains(a==='closemodal'?'modal':'drawer')&&ev.target!==el)return;
  if(a==='sel'){ev.stopPropagation();const n=+v;I.sel=I.sel.includes(n)?I.sel.filter(x=>x!==n):[...I.sel,n];return render()}
  switch(a){
   case 'tab':S.tab=v;break;
   case 'brandtoggle':{const p=$('#brandPanel');p.hidden=!p.hidden;el.setAttribute('aria-expanded',!p.hidden);return}
   case 'toast':return toast(v);
   case 'start':s.step='assess';s.qi=0;break;
   case 'ans':{const q=qList(s.ans)[s.qi];if(q.type==='one')s.ans[q.id]=v;else{let c=(s.ans[q.id]||[]).slice();if(v==='ns'||v==='none')c=c.includes(v)?[]:[v];else{c=c.filter(x=>x!=='ns'&&x!=='none');c=c.includes(v)?c.filter(x=>x!==v):[...c,v]}s.ans[q.id]=c}s.ans=pruneAns(s.ans);break}
   case 'next':{const L2=qList(s.ans);if(s.qi>=L2.length-1)s.step='summary';else s.qi++;break}
   case 'back':s.qi=Math.max(0,s.qi-1);break;
   case 'toplan':s.step='plan';break;
   case 'redo':s.step='assess';s.qi=0;break;
   case 'open':rememberFocus();s.open=v;break;
   case 'closedrawer':s.open=null;render();restoreFocus();return;
   case 'mark':s.done[v]=!s.done[v];break;
   case 'docs':s.step='docs';window.scrollTo(0,0);break;
   case 'backplan':s.step='plan';break;
   case 'dtab':s.doc.active=v;break;
   case 'vchk':s.doc.vchk[v]=!s.doc.vchk[v];break;
   case 'reqrev':{return modal(()=>{const nm=docList().find(x=>x[0]===actDoc())[1];return `<h2>Request a review of "${e(nm)}"</h2><p class="sm mut">Only this document is shared. You can stop sharing at any time.</p><label class="sm">Who should review it?<select id="revSel" style="width:100%;margin-top:4px"><option>Mentor at ${e(S.partner)} (comment only)</option><option>Panel counsel: Lexa &amp; Co.</option><option>A lawyer I choose (invite by email)</option></select></label><label class="sm" style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" id="revOk"> I agree to share this draft with the reviewer.</label><div class="note sm">A reviewer can comment and ask for changes. Approval is a lawyer's decision, never this tool's.</div><div class="row"><button class="btn pri" data-a="sendrev">Send request</button><button class="btn" data-a="closemodal">Cancel</button></div>`})}
   case 'sendrev':{if(!$('#revOk').checked)return toast('Tick the box to share this draft');const sel=$('#revSel');s.doc.rev[s.doc.active]={to:sel.options[sel.selectedIndex].text,at:'16 Oct 2026'};closeModal();toast('Review requested (demo)');break}
   case 'copydoc':{const txt=docText(s.doc.active);const pick=()=>{const r=document.createRange();r.selectNodeContents($('#docBody'));const g=getSelection();g.removeAllRanges();g.addRange(r);toast('Press Ctrl+C to copy the selected text')};if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Copied as plain text'),pick);else pick();return}
   case 'band':I.band=v;break;
   case 'srow':I.open=+v;break;
   case 'closedrill':I.open=null;break;
   case 'nudge':I.sel.forEach(n=>I.nudged[n]=1);toast(I.sel.length+' reminder'+(I.sel.length>1?'s':'')+' queued (demo)');I.sel=[];break;
   case 'nudge1':I.nudged[+v]=1;toast('Reminder queued (demo)');break;
   case 'addnote':{const t=$('#mnote').value.trim();if(!t)return;(I.notes[+v]=I.notes[+v]||[]).push(t);break}
   case 'invite':return modal(()=>`<h2>Bulk invite startups</h2><p class="mut sm">Paste emails or upload a CSV with: name, email, company, stage.</p><textarea rows="4" aria-label="Emails">riya@kaveri.example\nkaran@dhun.example</textarea><div class="note sm"><b>Preview of the email</b><br>Subject: Get your startup DPDP-ready with ${e(S.partner)} (due 30 Nov)<br>Hi Riya, ${e(S.partner)} is helping every startup in Cohort 2026 get ready for India\'s data protection law. It takes about 10 minutes to get your first plan.<br><br><b>What ${e(S.partner)} can see:</b> only your progress, unless you choose to share more.<br>Powered by ${e(B())}${S.by.trim()?' by '+e(S.by.trim()):''}. Guidance, not legal advice.</div><div class="row"><button class="btn pri" data-a="sendinv">Send invites</button><button class="btn" data-a="closemodal">Cancel</button></div>`);
   case 'sendinv':closeModal();return toast('2 invites queued (demo)');
   case 'export':return modal(()=>{const rows=SU.map(r=>[r.name,BL[r.band][0],r.open,r.over,r.rev,S.inc.mentor[r.i]||r.men,S.inc.counsel[r.i]||r.cns].join(',')).join('\n');return `<h2>Cohort report preview</h2><p class="sm mut">PDF and CSV export. The report includes only progress data the startups agreed to share.</p><pre class="mono sm" style="margin:0;overflow-x:auto;background:var(--paper);padding:12px;border-radius:4px">startup,band,must_dos_open,overdue_evidence,review,mentor,counsel\n${e(rows)}</pre><p class="sm mut">Colour reflects checklist progress, not legal compliance status. Guidance as of ${AS_OF}.</p><div class="row"><button class="btn pri" data-a="closemodal">Close</button></div>`});
   case 'closemodal':closeModal();break;
   case 'lawq':L.view='queue';break;
   case 'openmatter':L.view='wb';L.matter=+v;break;
   case 'litem':L.item=v;break;
   case 'cmt':{const b=$('#cmtbox');b.innerHTML=`<div style="margin-top:12px"><textarea id="cmtext" rows="3" placeholder="Comment on this paragraph" aria-label="Comment"></textarea><div class="row" style="margin-top:8px"><button class="btn sm pri" data-a="savecmt" data-v="${v}">Save comment</button></div></div>`;$('#cmtext').focus();return}
   case 'savecmt':{const t=$('#cmtext').value.trim();if(!t)return;L.comments.push({item:'notice',p:v,text:t,by:L.role==='partner'?'Partner':'Associate'});break}
   case 'reqchanges':{
     return modal(()=>{const active=L.comments.filter(c=>c.item!=='resolved');const draft=active.length?active.map((c,i)=>`${i+1}. ${c.text}`).join('\n'):'1. ';
     return `<h2>Request changes on Privacy notice v${L.ver}</h2><p class="sm mut">This goes to the client. It is a review comment, not an approval.</p><textarea id="chg" rows="6" aria-label="Note to client">Thanks, this is close. Before I can recommend approval:\n${e(draft)}\nResubmit when done. I will review again within 3 working days.</textarea><div class="note sm">Footer added automatically: "This is a review comment on a draft for this matter. It is not an approval."</div><div class="row"><button class="btn pri" data-a="sendchg">Send to client</button><button class="btn" data-a="closemodal">Cancel</button></div>`})}
   case 'sendchg':closeModal();L.stage='changes';toast('Changes requested sent to client');break;
   case 'resubmit':L.ver++;L.stage='review';L.comments=L.comments.map(c=>({...c,item:'resolved'}));toast('Client sent v'+L.ver);break;
   case 'recommend':L.stage='partner';toast('Sent to Partner Approver');break;
   case 'approve':return approveModal();
   case 'confirmlock':{const n=$('#signer').value.trim();if(n.length<3){$('#signer').style.borderColor='var(--red)';return toast('Type your full name to confirm')}
     L.lock={ver:L.ver,by:n,at:'16 Oct 2026',hash:hash(NOTICE.join('|')+L.ver+n)};L.stage='locked';closeModal();toast('Version locked');break}
   case 'report':return reportModal();
  }
  render();
});
document.addEventListener('change',ev=>{
  const t=ev.target,I=S.inc;
  if(t.id==='mSel'&&t.selectedIndex>0){I.sel.forEach(n=>I.mentor[n]=t.value);toast('Mentor assigned to '+I.sel.length);I.sel=[];render()}
  if(t.id==='cSel'&&t.selectedIndex>0){I.sel.forEach(n=>I.counsel[n]=t.value);toast('Counsel assigned to '+I.sel.length);I.sel=[];render()}
  if(t.id==='roleSel'){S.law.role=t.value;render()}
  if(t.id==='ownSel'&&S.st.open){S.st.owner[S.st.open]=t.value;toast('Owner updated')}
});
['inName','inBy','inPartner'].forEach(id=>$('#'+id).addEventListener('input',x=>{
  const v=x.target.value;if(id==='inName')S.brand=v;else if(id==='inBy')S.by=v;else S.partner=v;
  $('#bName').textContent=B();$('#bBy').textContent=S.by.trim()?'by '+S.by.trim():'';
  document.title=B()+' Prototype';
  if($('#layer .modal')&&modalFactory)refreshModal();
  else if(!$('#layer .modal'))render();
}));
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='inote'){S.law.note=t.value;return}
  const f=t.dataset&&t.dataset.f;if(!f)return;S.st.doc[f]=t.value;const p=$('#docPaper');if(p)p.innerHTML=docPaper();
});
document.addEventListener('keydown',ev=>{
  trapFocus(ev);
  if(ev.key==='Escape'){
    if($('#layer .modal')){closeModal();return}
    if(S.st.open){S.st.open=null;render();restoreFocus();return}
  }
  const tab=ev.target.closest&&ev.target.closest('[role="tab"]');
  if(tab&&(ev.key==='ArrowRight'||ev.key==='ArrowLeft'||ev.key==='Home'||ev.key==='End')){
    const tabs=[...document.querySelectorAll('.tab')];
    let i=tabs.indexOf(tab);
    if(ev.key==='ArrowRight')i=(i+1)%tabs.length;
    else if(ev.key==='ArrowLeft')i=(i-1+tabs.length)%tabs.length;
    else if(ev.key==='Home')i=0;
    else if(ev.key==='End')i=tabs.length-1;
    ev.preventDefault();
    S.tab=tabs[i].dataset.v;render();tabs[i].focus();
    return;
  }
  const row=ev.target.closest&&ev.target.closest('tr[data-a][tabindex]');
  if(row&&(ev.key==='Enter'||ev.key===' ')){
    if(ev.target.closest('input,button,select,textarea'))return;
    ev.preventDefault();
    row.click();
  }
});
render();
</script>
</body>
